version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email_marketing_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///email.db
      - EMAIL_PROVIDER=resend
      - RESEND_API_KEY=${RESEND_API_KEY:-your_resend_api_key}
      - SECRET_KEY=${SECRET_KEY:-your-production-secret-key}
      - FRONTEND_URL=http://localhost:3000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ../email_scraper_frontend
      dockerfile: Dockerfile
    container_name: email_scraper_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
